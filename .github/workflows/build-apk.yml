name: Universal HTML ZIP to APK Builder

on:
  workflow_dispatch:
    inputs:
      buildId:
        description: "Build ID"
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout the user's build branch
      # --------------------------------------------------
      - name: Checkout Build Branch
        uses: actions/checkout@v4
        with:
          ref: build/${{ inputs.buildId }}
          fetch-depth: 1

      # --------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 4. Accept Android licenses
      # --------------------------------------------------
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # --------------------------------------------------
      # 5. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # --------------------------------------------------
      # 6. Read build metadata
      # --------------------------------------------------
      - name: Read Build Metadata
        id: metadata
        shell: bash
        run: |
          set -e

          if [ -f build-meta.json ]; then
            echo "Metadata file found:"
            cat build-meta.json

            APP_NAME=$(python3 -c "import json; print(json.load(open('build-meta.json')).get('appName','Cricket App'))")
            PACKAGE_NAME=$(python3 -c "import json; print(json.load(open('build-meta.json')).get('packageName','com.cricketlovers.app'))")

          elif [ -f metadata.json ]; then
            echo "metadata.json found:"
            cat metadata.json

            APP_NAME=$(python3 -c "import json; print(json.load(open('metadata.json')).get('appName','Cricket App'))")
            PACKAGE_NAME=$(python3 -c "import json; print(json.load(open('metadata.json')).get('packageName','com.cricketlovers.app'))")

          else
            echo "No metadata file found."
            APP_NAME="Cricket App"
            PACKAGE_NAME="com.cricketlovers.app"
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          echo "App Name: $APP_NAME"
          echo "Package Name: $PACKAGE_NAME"

      # --------------------------------------------------
      # 7. Create Android project
      # --------------------------------------------------
      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf android-project

          mkdir -p android-project/app/src/main/java/${PACKAGE_NAME//.//}
          mkdir -p android-project/app/src/main/res/layout
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi

      # --------------------------------------------------
      # 8. Copy HTML project
      # --------------------------------------------------
      - name: Prepare Web Project
        shell: bash
        run: |
          set -e

          mkdir -p android-project/app/src/main/assets

          if [ -d "www" ]; then
            cp -R www/. android-project/app/src/main/assets/
          elif [ -d "web" ]; then
            cp -R web/. android-project/app/src/main/assets/
          elif [ -f "index.html" ]; then
            cp -R . android-project/app/src/main/assets/
          else
            echo "ERROR: No HTML project found."
            exit 1
          fi

          echo "Web files:"
          find android-project/app/src/main/assets -maxdepth 2 -type f | head -100

      # --------------------------------------------------
      # 9. Create settings.gradle
      # --------------------------------------------------
      - name: Create Gradle Settings
        shell: bash
        run: |
          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HtmlToApk"
          include(":app")
          EOF

      # --------------------------------------------------
      # 10. Create root build.gradle
      # --------------------------------------------------
      - name: Create Root Gradle File
        shell: bash
        run: |
          cat > android-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      # --------------------------------------------------
      # 11. Create app build.gradle
      # --------------------------------------------------
      - name: Create App Gradle File
        shell: bash
        run: |
          cat > android-project/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '${PACKAGE_NAME}'
              compileSdk 35

              defaultConfig {
                  applicationId '${PACKAGE_NAME}'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.3'
          }
          EOF

      # --------------------------------------------------
      # 12. Create AndroidManifest
      # --------------------------------------------------
      - name: Create Android Manifest
        shell: bash
        run: |
          mkdir -p android-project/app/src/main

          cat > android-project/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="${APP_NAME}"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # --------------------------------------------------
      # 13. Create Android theme
      # --------------------------------------------------
      - name: Create Android Theme
        shell: bash
        run: |
          mkdir -p android-project/app/src/main/res/values

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#10B981</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

          </resources>
          EOF

      # --------------------------------------------------
      # 14. Create MainActivity
      # --------------------------------------------------
      - name: Create MainActivity
        shell: bash
        run: |
          PACKAGE_PATH="${PACKAGE_NAME//.//}"
          mkdir -p "android-project/app/src/main/java/$PACKAGE_PATH"

          cat > "android-project/app/src/main/java/$PACKAGE_PATH/MainActivity.java" <<EOF
          package ${PACKAGE_NAME};

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # --------------------------------------------------
      # 15. Build APK
      # --------------------------------------------------
      - name: Build APK
        working-directory: android-project
        shell: bash
        run: |
          set -e

          echo "Checking Gradle..."
          gradle --version

          echo "Building APK..."

          gradle :app:assembleDebug --no-daemon --stacktrace

      # --------------------------------------------------
      # 16. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching APK..."

          find android-project -type f -name "*.apk" -print

          APK_FILE=$(find android-project -type f -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found: $APK_FILE"

          mkdir -p output

          cp "$APK_FILE" "output/${APP_NAME// /_}.apk"

          ls -lh output/

      # --------------------------------------------------
      # 17. Upload APK artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ inputs.buildId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------------
      # 18. Build completed
      # --------------------------------------------------
      - name: Build Complete
        run: |
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "Build ID: ${{ inputs.buildId }}"
          echo "App Name: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "======================================"
