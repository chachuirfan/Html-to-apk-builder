name: Universal HTML ZIP to APK Builder

on:
  workflow_dispatch:
    inputs:
      buildId:
        description: "Build ID"
        required: true
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Build Branch
        uses: actions/checkout@v4
        with:
          ref: build/${{ inputs.buildId }}
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Read Build Metadata
        shell: bash
        run: |
          set -e

          echo "Checking metadata files..."

          if [ -f "build-meta.json" ]; then

            echo "Found build-meta.json"
            cat build-meta.json

            APP_NAME=$(python3 -c "import json; print(json.load(open('build-meta.json')).get('appName','Cricket App'))")
            PACKAGE_NAME=$(python3 -c "import json; print(json.load(open('build-meta.json')).get('packageName','com.cricketlovers.app'))")

          elif [ -f "metadata.json" ]; then

            echo "Found metadata.json"
            cat metadata.json

            APP_NAME=$(python3 -c "import json; print(json.load(open('metadata.json')).get('appName','Cricket App'))")
            PACKAGE_NAME=$(python3 -c "import json; print(json.load(open('metadata.json')).get('packageName','com.cricketlovers.app'))")

          else

            echo "Metadata file not found."
            echo "Using default values."

            APP_NAME="Cricket App"
            PACKAGE_NAME="com.cricketlovers.app"

          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          echo "--------------------------------"
          echo "APP NAME: $APP_NAME"
          echo "PACKAGE:  $PACKAGE_NAME"
          echo "--------------------------------"

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          rm -rf android-project

          PACKAGE_PATH="${PACKAGE_NAME//./\/}"

          mkdir -p "android-project/app/src/main/java/$PACKAGE_PATH"
          mkdir -p "android-project/app/src/main/res/values"
          mkdir -p "android-project/app/src/main/res/layout"

          echo "Android project folders created."

      - name: Create gradle.properties
        shell: bash
        run: |
          set -e

          cat > android-project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "gradle.properties:"
          cat android-project/gradle.properties

      - name: Prepare Web Project
        shell: bash
        run: |
          set -e

          mkdir -p android-project/app/src/main/assets

          if [ -d "www" ]; then

            echo "Using www folder..."
            cp -R www/. android-project/app/src/main/assets/

          elif [ -d "web" ]; then

            echo "Using web folder..."
            cp -R web/. android-project/app/src/main/assets/

          elif [ -f "index.html" ]; then

            echo "Using root HTML project..."

            find . -maxdepth 1 \
              ! -name "." \
              ! -name ".git" \
              ! -name "android-project" \
              -exec cp -R {} android-project/app/src/main/assets/ \;

          else

            echo "ERROR: index.html not found."
            exit 1

          fi

          echo ""
          echo "HTML files prepared:"
          find android-project/app/src/main/assets -maxdepth 3 -type f | head -100

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HtmlToApk"

          include(":app")
          EOF

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > android-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > android-project/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '${PACKAGE_NAME}'

              compileSdk 35

              defaultConfig {
                  applicationId '${PACKAGE_NAME}'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {

              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.3'

              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
          }
          EOF

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > android-project/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="${APP_NAME}"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create Android Style
        shell: bash
        run: |
          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#10B981</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      - name: Create MainActivity
        shell: bash
        run: |
          set -e

          PACKAGE_PATH="${PACKAGE_NAME//./\/}"

          mkdir -p "android-project/app/src/main/java/$PACKAGE_PATH"

          cat > "android-project/app/src/main/java/$PACKAGE_PATH/MainActivity.java" <<EOF
          package ${PACKAGE_NAME};

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          echo "Android project:"
          find android-project -maxdepth 6 -type f | sort

          echo ""
          echo "Checking index.html..."

          if [ ! -f "android-project/app/src/main/assets/index.html" ]; then
              echo "ERROR: index.html was not copied."
              exit 1
          fi

          echo "index.html found successfully."

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Gradle Version
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Gradle version being used:"
          echo "========================================"

          gradle --version

      - name: Build APK
        working-directory: android-project
        shell: bash
        run: |
          set -e

          echo "Starting Android APK build..."
          echo "Using Gradle 8.9"
          echo "Using Android Gradle Plugin 8.7.3"
          echo "AndroidX enabled"
          echo "Kotlin dependency alignment enabled"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android-project -type f -name "*.apk" -print

          APK_FILE=$(find android-project -type f -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
              echo "ERROR: APK was not created."
              exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p output

          cp "$APK_FILE" "output/${APP_NAME// /_}.apk"

          echo ""
          echo "Final APK:"
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ inputs.buildId }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build Complete
        run: |
          echo ""
          echo "========================================"
          echo "       APK BUILD SUCCESSFUL"
          echo "========================================"
          echo "Build ID: ${{ inputs.buildId }}"
          echo "App Name: $APP_NAME"
          echo "Package:  $PACKAGE_NAME"
          echo "Gradle:   8.9"
          echo "AGP:      8.7.3"
          echo "AndroidX: ENABLED"
          echo "Kotlin:   ALIGNED"
          echo "========================================"
