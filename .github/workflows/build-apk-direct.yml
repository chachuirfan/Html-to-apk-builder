name: Direct HTML to APK Builder

on:
  push:
    branches:
      - "build/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout current build branch
      # ==========================================
      - name: Checkout Build
        uses: actions/checkout@v4

      # ==========================================
      # 2. Get Build ID
      # ==========================================
      - name: Get Build ID
        id: build_info
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" == build/* ]]; then
            BUILD_ID="${BRANCH#build/}"
          else
            BUILD_ID="manual-${GITHUB_RUN_NUMBER}"
          fi

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          echo "================================"
          echo "Build ID: $BUILD_ID"
          echo "Branch: $BRANCH"
          echo "================================"

      # ==========================================
      # 3. Setup Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 5. Install Android SDK packages
      # ==========================================
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # 6. Read Build Metadata
      # ==========================================
      - name: Read Build Metadata
        shell: bash
        run: |
          META=""

          if [ -f "build-meta.json" ]; then
            META="build-meta.json"
          elif [ -f "metadata.json" ]; then
            META="metadata.json"
          fi

          if [ -n "$META" ]; then
            echo "Metadata file found: $META"

            APP_NAME=$(python3 -c '
          import json
          d=json.load(open("'"$META"'"))
          print(d.get("appName","Irfan Web App"))
          ')

            PACKAGE_NAME=$(python3 -c '
          import json
          d=json.load(open("'"$META"'"))
          print(d.get("packageName","com.irfan.webapp"))
          ')

            VERSION_NAME=$(python3 -c '
          import json
          d=json.load(open("'"$META"'"))
          print(d.get("versionName","1.0"))
          ')

            VERSION_CODE=$(python3 -c '
          import json
          d=json.load(open("'"$META"'"))
          print(d.get("versionCode",1))
          ')

            MIN_SDK=$(python3 -c '
          import json
          d=json.load(open("'"$META"'"))
          print(d.get("minSdk",23))
          ')

            ORIENTATION=$(python3 -c '
          import json
          d=json.load(open("'"$META"'"))
          print(d.get("orientation","portrait"))
          ')

            BUILD_TYPE=$(python3 -c '
          import json
          d=json.load(open("'"$META"'"))
          print(d.get("buildType","debug"))
          ')

            AGP=$(python3 -c '
          import json
          d=json.load(open("'"$META"'"))
          print(d.get("agp","8.7.3"))
          ')

          else
            echo "No metadata file found. Using defaults."

            APP_NAME="Irfan Web App"
            PACKAGE_NAME="com.irfan.webapp"
            VERSION_NAME="1.0"
            VERSION_CODE="1"
            MIN_SDK="23"
            ORIENTATION="portrait"
            BUILD_TYPE="debug"
            AGP="8.7.3"
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "MIN_SDK=$MIN_SDK" >> "$GITHUB_ENV"
          echo "ORIENTATION=$ORIENTATION" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          echo "AGP=$AGP" >> "$GITHUB_ENV"

          echo "--------------------------------"
          echo "App Name: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
          echo "Min SDK: $MIN_SDK"
          echo "Orientation: $ORIENTATION"
          echo "Build Type: $BUILD_TYPE"
          echo "AGP: $AGP"
          echo "--------------------------------"

      # ==========================================
      # 7. Prepare Web Source
      # ==========================================
      - name: Prepare Web Source
        shell: bash
        run: |
          mkdir -p app/src/main/assets

          FOUND=0

          # Single HTML file
          if [ -f "index.html" ]; then
            cp "index.html" "app/src/main/assets/index.html"
            FOUND=1
          fi

          # Other common web folders
          for DIR in www web website public source src; do
            if [ -d "$DIR" ]; then
              echo "Copying web folder: $DIR"
              cp -R "$DIR"/. app/src/main/assets/
              FOUND=1
              break
            fi
          done

          # Uploaded source folder
          if [ -d "uploads" ]; then
            echo "Checking uploads folder..."

            FIRST_DIR=$(find uploads -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)

            if [ -n "$FIRST_DIR" ]; then
              echo "Using uploaded folder: $FIRST_DIR"

              if [ -f "$FIRST_DIR/index.html" ]; then
                cp -R "$FIRST_DIR"/. app/src/main/assets/
                FOUND=1
              fi
            fi
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No HTML/Web source found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -f "app/src/main/assets/index.html" ]; then
            FIRST_HTML=$(find app/src/main/assets -type f \( -name "*.html" -o -name "*.htm" \) | head -n 1 || true)

            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" "app/src/main/assets/index.html"
            else
              echo "ERROR: index.html not found."
              exit 1
            fi
          fi

          echo "Web source prepared:"
          find app/src/main/assets -maxdepth 3 -type f | sort

      # ==========================================
      # 8. Create Android Project
      # ==========================================
      - name: Create Android Project
        shell: bash
        run: |

          mkdir -p \
            app/src/main/java \
            app/src/main/res/layout \
            app/src/main/res/values

          JAVA_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          mkdir -p "app/src/main/java/$JAVA_PATH"

          # --------------------------------------
          # settings.gradle
          # --------------------------------------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HTMLToAPKBuilder"
          include(":app")
          EOF

          # --------------------------------------
          # Root build.gradle
          # --------------------------------------
          cat > build.gradle <<EOF
          plugins {
              id "com.android.application" version "$AGP" apply false
          }
          EOF

          # --------------------------------------
          # gradle.properties
          # --------------------------------------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # --------------------------------------
          # App build.gradle
          # --------------------------------------
          cat > app/build.gradle <<EOF
          plugins {
              id "com.android.application"
          }

          android {
              namespace "$PACKAGE_NAME"
              compileSdk 35

              defaultConfig {
                  applicationId "$PACKAGE_NAME"
                  minSdk $MIN_SDK
                  targetSdk 35
                  versionCode $VERSION_CODE
                  versionName "$VERSION_NAME"
              }
          }

          dependencies {
              implementation "androidx.appcompat:appcompat:1.7.1"
              implementation "androidx.activity:activity:1.10.1"
          }
          EOF

          # --------------------------------------
          # Orientation
          # --------------------------------------
          case "$ORIENTATION" in
            landscape)
              SCREEN_ORIENTATION="landscape"
              ;;
            sensor)
              SCREEN_ORIENTATION="fullSensor"
              ;;
            *)
              SCREEN_ORIENTATION="portrait"
              ;;
          esac

          # --------------------------------------
          # Android Manifest
          # --------------------------------------
          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="$SCREEN_ORIENTATION"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # --------------------------------------
          # Layout
          # --------------------------------------
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>

          </FrameLayout>
          EOF

          # --------------------------------------
          # Styles
          # --------------------------------------
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#12D6A0</item>
                  <item name="android:statusBarColor">#05090D</item>
                  <item name="android:navigationBarColor">#05090D</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          # --------------------------------------
          # Strings
          # --------------------------------------
          python3 - <<PY
          import html

          app_name = html.escape("""$APP_NAME""")

          with open("app/src/main/res/values/strings.xml","w") as f:
              f.write(
                  '<resources>\\n'
                  f'    <string name="app_name">{app_name}</string>\\n'
                  '</resources>\\n'
              )
          PY

      # ==========================================
      # 9. Create MainActivity.java
      # ==========================================
      - name: Create MainActivity
        shell: bash
        run: |

          JAVA_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          cat > "app/src/main/java/$JAVA_PATH/MainActivity.java" <<EOF
          package $PACKAGE_NAME;

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          String url = request.getUrl().toString();

                          if (url.startsWith("http://")
                                  || url.startsWith("https://")) {

                              return false;
                          }

                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> filePathCallback,
                              FileChooserParams fileChooserParams) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = filePathCallback;

                          try {

                              Intent intent =
                                      fileChooserParams.createIntent();

                              startActivityForResult(intent, 1001);

                              return true;

                          } catch (Exception e) {

                              fileCallback = null;

                              return false;
                          }
                      }

                      @Override
                      public void onPermissionRequest(
                              final PermissionRequest request) {

                          runOnUiThread(() -> {

                              request.grant(
                                      request.getResources()
                              );

                          });
                      }
                  });

                  webView.setDownloadListener(
                          (url, userAgent, contentDisposition,
                           mimeType, contentLength) -> {

                              try {

                                  DownloadManager.Request request =
                                          new DownloadManager.Request(
                                                  Uri.parse(url)
                                          );

                                  request.setMimeType(mimeType);

                                  request.setNotificationVisibility(
                                          DownloadManager.Request
                                                  .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                                  );

                                  request.setDestinationInExternalPublicDir(
                                          Environment.DIRECTORY_DOWNLOADS,
                                          "download"
                                  );

                                  DownloadManager manager =
                                          (DownloadManager)
                                                  getSystemService(
                                                          DOWNLOAD_SERVICE
                                                  );

                                  manager.enqueue(request);

                              } catch (Exception ignored) {
                              }

                          }
                  );

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode == 1001
                          && fileCallback != null) {

                      Uri[] results =
                              WebChromeClient.FileChooserParams
                                      .parseResult(
                                              resultCode,
                                              data
                                      );

                      fileCallback.onReceiveValue(results);

                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView != null
                          && webView.canGoBack()) {

                      webView.goBack();

                      return;
                  }

                  super.onBackPressed();
              }
          }
          EOF

      # ==========================================
      # 10. Generate Gradle Wrapper
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.9

      # ==========================================
      # 11. Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x ./gradlew

          ./gradlew --no-daemon clean assembleDebug

      # ==========================================
      # 12. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p final-apk

          cp "$APK" "final-apk/${APP_NAME//[^A-Za-z0-9_-]/_}-${BUILD_ID}.apk"

          echo "Final APK:"
          ls -lh final-apk/

      # ==========================================
      # 13. Upload APK Artifact
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ env.BUILD_ID }}
          path: final-apk/*.apk
          retention-days: 7

      # ==========================================
      # 14. Build Summary
      # ==========================================
      - name: Build Summary
        shell: bash
        run: |
          echo "## 📱 APK BUILD SUCCESSFUL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**App Name:** $APP_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** $PACKAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build ID:** $BUILD_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### APK Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
