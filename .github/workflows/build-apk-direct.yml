name: Direct HTML to APK Builder

on:
  push:
    branches:
      - "build/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. GET BUILD ID
      # ============================================================

      - name: Get Build ID
        shell: bash
        run: |
          BUILD_ID="${GITHUB_REF_NAME#build/}"

          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: Build ID is empty"
            exit 1
          fi

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          echo "======================================"
          echo "BUILD ID: $BUILD_ID"
          echo "BRANCH: $GITHUB_REF_NAME"
          echo "======================================"


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 5. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          echo "Creating Android project..."

          mkdir -p app/src/main/java/com/htmlapk/builder
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/assets

          mkdir -p gradle/wrapper


      # ============================================================
      # 6. SETTINGS.GRADLE
      # ============================================================

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "HtmlToApkBuilder"

include(":app")
EOF


      # ============================================================
      # 7. ROOT BUILD.GRADLE
      # ============================================================

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF


      # ============================================================
      # 8. GRADLE PROPERTIES
      # ============================================================

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF


      # ============================================================
      # 9. APP BUILD.GRADLE
      # ============================================================

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.htmlapk.builder'
    compileSdk 35

    defaultConfig {
        applicationId "com.htmlapk.builder"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'androidx.webkit:webkit:1.12.1'
}
EOF


      # ============================================================
      # 10. ANDROID MANIFEST
      # ============================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />

    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

    <uses-permission
        android:name="android.permission.READ_EXTERNAL_STORAGE"
        android:maxSdkVersion="32" />

    <uses-permission
        android:name="android.permission.WRITE_EXTERNAL_STORAGE"
        android:maxSdkVersion="28" />

    <application
        android:allowBackup="true"
        android:usesCleartextTraffic="true"
        android:hardwareAccelerated="true"
        android:label="HTML APK"
        android:theme="@style/AppTheme">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:screenOrientation="unspecified"
            android:configChanges="orientation|screenSize|keyboardHidden">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF


      # ============================================================
      # 11. STYLES
      # ============================================================

      - name: Create styles.xml
        shell: bash
        run: |

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>

    <style name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowActionModeOverlay">true</item>
        <item name="android:colorAccent">#2196F3</item>
        <item name="android:navigationBarColor">#000000</item>
        <item name="android:statusBarColor">#000000</item>
        <item name="android:windowLightStatusBar">false</item>

    </style>

</resources>
EOF


      # ============================================================
      # 12. ACTIVITY MAIN XML
      #
      # IMPORTANT:
      # XML declaration MUST be the FIRST CHARACTER.
      # No blank line before it.
      # ============================================================

      - name: Create activity_main.xml
        shell: bash
        run: |

          mkdir -p app/src/main/res/layout

          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"' \
          '    android:layout_width="match_parent"' \
          '    android:layout_height="match_parent">' \
          '' \
          '    <WebView' \
          '        android:id="@+id/webView"' \
          '        android:layout_width="match_parent"' \
          '        android:layout_height="match_parent" />' \
          '' \
          '</FrameLayout>' \
          > app/src/main/res/layout/activity_main.xml


      # ============================================================
      # 13. MAIN ACTIVITY JAVA
      #
      # Uses WebViewAssetLoader:
      #
      # https://appassets.androidplatform.net/assets/index.html
      #
      # This avoids the old file:// WebView problem.
      # ============================================================

      - name: Create MainActivity.java
        shell: bash
        run: |

          cat > app/src/main/java/com/htmlapk/builder/MainActivity.java <<'EOF'
package com.htmlapk.builder;

import android.Manifest;
import android.app.Activity;
import android.content.ActivityNotFoundException;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.net.Uri;
import android.os.Bundle;
import android.webkit.CookieManager;
import android.webkit.DownloadListener;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.PermissionRequest;

import androidx.annotation.Nullable;
import androidx.appcompat.app.AppCompatActivity;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import androidx.webkit.WebViewAssetLoader;

import java.util.ArrayList;
import java.util.List;

public class MainActivity extends AppCompatActivity {

    private static final int PERMISSION_REQUEST_CODE = 2001;
    private static final int FILE_CHOOSER_REQUEST_CODE = 3001;

    private WebView webView;

    private ValueCallback<Uri[]> filePathCallback;

    private WebViewAssetLoader assetLoader;


    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        setContentView(R.layout.activity_main);

        webView = findViewById(R.id.webView);


        // ------------------------------------------------------------
        // WebView Asset Loader
        // ------------------------------------------------------------

        assetLoader = new WebViewAssetLoader.Builder()
                .addPathHandler(
                        "/assets/",
                        new WebViewAssetLoader.AssetsPathHandler(this)
                )
                .build();


        // ------------------------------------------------------------
        // WebView Settings
        // ------------------------------------------------------------

        WebSettings settings = webView.getSettings();

        settings.setJavaScriptEnabled(true);

        settings.setDomStorageEnabled(true);

        settings.setDatabaseEnabled(true);

        settings.setAllowFileAccess(true);

        settings.setAllowContentAccess(true);

        settings.setJavaScriptCanOpenWindowsAutomatically(true);

        settings.setSupportMultipleWindows(true);

        settings.setMediaPlaybackRequiresUserGesture(false);

        settings.setBuiltInZoomControls(false);

        settings.setDisplayZoomControls(false);

        settings.setLoadWithOverviewMode(false);

        settings.setUseWideViewPort(true);

        settings.setSupportZoom(false);

        settings.setAllowUniversalAccessFromFileURLs(true);

        settings.setAllowFileAccessFromFileURLs(true);


        // ------------------------------------------------------------
        // Cookies
        // ------------------------------------------------------------

        CookieManager cookieManager = CookieManager.getInstance();

        cookieManager.setAcceptCookie(true);

        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.LOLLIPOP) {
            cookieManager.setAcceptThirdPartyCookies(webView, true);
        }


        // ------------------------------------------------------------
        // WebView Client
        // ------------------------------------------------------------

        webView.setWebViewClient(new WebViewClient() {

            @Override
            public WebResourceResponse shouldInterceptRequest(
                    WebView view,
                    WebResourceRequest request
            ) {

                WebResourceResponse response =
                        assetLoader.shouldInterceptRequest(request.getUrl());

                if (response != null) {
                    return response;
                }

                return super.shouldInterceptRequest(view, request);
            }

            @Override
            public WebResourceResponse shouldInterceptRequest(
                    WebView view,
                    String url
            ) {

                WebResourceResponse response =
                        assetLoader.shouldInterceptRequest(Uri.parse(url));

                if (response != null) {
                    return response;
                }

                return super.shouldInterceptRequest(view, url);
            }
        });


        // ------------------------------------------------------------
        // Chrome Client
        // ------------------------------------------------------------

        webView.setWebChromeClient(new WebChromeClient() {

            @Override
            public void onPermissionRequest(final PermissionRequest request) {

                runOnUiThread(() -> {

                    List<String> resources = new ArrayList<>();

                    for (String resource : request.getResources()) {

                        if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {

                            if (ContextCompat.checkSelfPermission(
                                    MainActivity.this,
                                    Manifest.permission.RECORD_AUDIO
                            ) == PackageManager.PERMISSION_GRANTED) {

                                resources.add(
                                        PermissionRequest.RESOURCE_AUDIO_CAPTURE
                                );
                            }

                        } else if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {

                            if (ContextCompat.checkSelfPermission(
                                    MainActivity.this,
                                    Manifest.permission.CAMERA
                            ) == PackageManager.PERMISSION_GRANTED) {

                                resources.add(
                                        PermissionRequest.RESOURCE_VIDEO_CAPTURE
                                );
                            }
                        }
                    }

                    if (!resources.isEmpty()) {

                        request.grant(
                                resources.toArray(new String[0])
                        );

                    } else {

                        request.deny();
                    }
                });
            }


            @Override
            public boolean onShowFileChooser(
                    WebView webView,
                    ValueCallback<Uri[]> callback,
                    FileChooserParams fileChooserParams
            ) {

                if (filePathCallback != null) {
                    filePathCallback.onReceiveValue(null);
                }

                filePathCallback = callback;

                Intent intent;

                try {

                    intent = fileChooserParams.createIntent();

                } catch (Exception e) {

                    intent = new Intent(Intent.ACTION_GET_CONTENT);

                    intent.setType("*/*");

                    intent.addCategory(Intent.CATEGORY_OPENABLE);
                }

                try {

                    startActivityForResult(
                            intent,
                            FILE_CHOOSER_REQUEST_CODE
                    );

                } catch (ActivityNotFoundException e) {

                    filePathCallback = null;

                    return false;
                }

                return true;
            }
        });


        // ------------------------------------------------------------
        // Downloads
        // ------------------------------------------------------------

        webView.setDownloadListener(
                new DownloadListener() {

                    @Override
                    public void onDownloadStart(
                            String url,
                            String userAgent,
                            String contentDisposition,
                            String mimetype,
                            long contentLength
                    ) {

                        try {

                            Intent intent =
                                    new Intent(Intent.ACTION_VIEW);

                            intent.setData(Uri.parse(url));

                            startActivity(intent);

                        } catch (Exception ignored) {
                        }
                    }
                }
        );


        // ------------------------------------------------------------
        // Request Android permissions
        // ------------------------------------------------------------

        requestRequiredPermissions();


        // ------------------------------------------------------------
        // Load HTML
        // ------------------------------------------------------------

        webView.loadUrl(
                "https://appassets.androidplatform.net/assets/index.html"
        );
    }


    // ================================================================
    // ANDROID PERMISSIONS
    // ================================================================

    private void requestRequiredPermissions() {

        ArrayList<String> permissions =
                new ArrayList<>();


        if (ContextCompat.checkSelfPermission(
                this,
                Manifest.permission.CAMERA
        ) != PackageManager.PERMISSION_GRANTED) {

            permissions.add(
                    Manifest.permission.CAMERA
            );
        }


        if (ContextCompat.checkSelfPermission(
                this,
                Manifest.permission.RECORD_AUDIO
        ) != PackageManager.PERMISSION_GRANTED) {

            permissions.add(
                    Manifest.permission.RECORD_AUDIO
            );
        }


        if (!permissions.isEmpty()) {

            ActivityCompat.requestPermissions(
                    this,
                    permissions.toArray(new String[0]),
                    PERMISSION_REQUEST_CODE
            );
        }
    }


    // ================================================================
    // FILE CHOOSER RESULT
    // ================================================================

    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            @Nullable Intent data
    ) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );


        if (requestCode == FILE_CHOOSER_REQUEST_CODE) {

            Uri[] results = null;


            if (resultCode == Activity.RESULT_OK) {

                if (data != null) {

                    String dataString =
                            data.getDataString();

                    if (dataString != null) {

                        results = new Uri[]{
                                Uri.parse(dataString)
                        };

                    } else if (data.getClipData() != null) {

                        int count =
                                data.getClipData().getItemCount();

                        results = new Uri[count];

                        for (int i = 0; i < count; i++) {

                            results[i] =
                                    data.getClipData()
                                            .getItemAt(i)
                                            .getUri();
                        }
                    }
                }
            }


            if (filePathCallback != null) {

                filePathCallback.onReceiveValue(results);

                filePathCallback = null;
            }
        }
    }


    // ================================================================
    // BACK BUTTON
    // ================================================================

    @Override
    public void onBackPressed() {

        if (webView != null && webView.canGoBack()) {

            webView.goBack();

        } else {

            super.onBackPressed();
        }
    }


    // ================================================================
    // CLEANUP
    // ================================================================

    @Override
    protected void onDestroy() {

        if (webView != null) {

            webView.stopLoading();

            webView.setWebChromeClient(null);

            webView.setWebViewClient(null);

            webView.destroy();
        }

        super.onDestroy();
    }
}
EOF


      # ============================================================
      # 14. PREPARE WEB SOURCE
      #
      # Supports:
      # - root index.html
      # - www/
      # - web/
      # - website/
      # - public/
      # - source/
      # - src/
      # - ZIP files
      # - uploads/
      # ============================================================

      - name: Prepare HTML source
        shell: bash
        run: |

          set -e

          rm -rf app/src/main/assets/*

          mkdir -p app/src/main/assets


          echo "======================================"
          echo "Preparing HTML source..."
          echo "======================================"


          # ----------------------------------------------------------
          # CASE 1: ROOT index.html
          # ----------------------------------------------------------

          if [ -f "index.html" ]; then

              echo "Found root index.html"

              cp -a . app/src/main/assets/

          else

              # ------------------------------------------------------
              # CASE 2: COMMON WEB DIRECTORIES
              # ------------------------------------------------------

              SOURCE_DIR=""

              for DIR in www web website public source src; do

                  if [ -f "$DIR/index.html" ]; then

                      SOURCE_DIR="$DIR"
                      break

                  fi

              done


              if [ -n "$SOURCE_DIR" ]; then

                  echo "Found HTML source in: $SOURCE_DIR"

                  cp -a "$SOURCE_DIR"/. app/src/main/assets/

              else

                  # --------------------------------------------------
                  # CASE 3: ZIP FILE
                  # --------------------------------------------------

                  ZIP_FILE=""

                  for FILE in *.zip uploads/*.zip; do

                      if [ -f "$FILE" ]; then

                          ZIP_FILE="$FILE"
                          break

                      fi

                  done


                  if [ -n "$ZIP_FILE" ]; then

                      echo "Found ZIP: $ZIP_FILE"

                      rm -rf /tmp/html-source

                      mkdir -p /tmp/html-source

                      unzip -q "$ZIP_FILE" -d /tmp/html-source


                      INDEX_PATH=$(find /tmp/html-source \
                        -type f \
                        -iname "index.html" \
                        | head -n 1)


                      if [ -z "$INDEX_PATH" ]; then

                          echo "ERROR: No index.html found inside ZIP."

                          exit 1

                      fi


                      INDEX_DIR=$(dirname "$INDEX_PATH")

                      echo "Using HTML directory:"
                      echo "$INDEX_DIR"


                      cp -a "$INDEX_DIR"/. app/src/main/assets/

                  else

                      echo "ERROR: No index.html or supported ZIP/source directory found."

                      echo ""
                      echo "Files in repository:"
                      find . -maxdepth 3 -type f | sort | head -200

                      exit 1
                  fi
              fi
          fi


          # ----------------------------------------------------------
          # Remove build-related files from web assets
          # ----------------------------------------------------------

          rm -rf app/src/main/assets/.git
          rm -rf app/src/main/assets/.github

          rm -f app/src/main/assets/build.gradle
          rm -f app/src/main/assets/settings.gradle
          rm -f app/src/main/assets/gradle.properties


          echo ""
          echo "======================================"
          echo "Web files included in APK:"
          echo "======================================"

          find app/src/main/assets \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300


          if [ ! -f "app/src/main/assets/index.html" ]; then

              echo ""
              echo "ERROR: Final assets/index.html was not created."

              exit 1
          fi


      # ============================================================
      # 15. GRADLE WRAPPER
      # ============================================================

      - name: Create Gradle wrapper
        shell: bash
        run: |

          set -e

          curl -L \
            -o gradle-wrapper.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-wrapper.zip

          rm -rf /tmp/gradle-wrapper

          mkdir -p /tmp/gradle-wrapper

          cp -a gradle-8.9/lib/gradle-wrapper* \
            /tmp/gradle-wrapper/ 2>/dev/null || true

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF


          cat > gradlew <<'EOF'
#!/bin/sh

set -e

GRADLE_VERSION="8.9"

DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-$GRADLE_VERSION-bin"

mkdir -p "$DIST_DIR"

ZIP="$DIST_DIR/gradle.zip"

INSTALL="$DIST_DIR/gradle-$GRADLE_VERSION"

if [ ! -x "$INSTALL/bin/gradle" ]; then

    if [ ! -f "$ZIP" ]; then

        echo "Downloading Gradle $GRADLE_VERSION..."

        curl -L \
          -o "$ZIP" \
          "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
    fi

    rm -rf "$INSTALL"

    mkdir -p "$INSTALL"

    unzip -q "$ZIP" -d "$DIST_DIR"

    if [ -d "$DIST_DIR/gradle-$GRADLE_VERSION" ]; then

        :

    fi
fi

exec "$DIST_DIR/gradle-$GRADLE_VERSION/bin/gradle" "$@"
EOF


          chmod +x gradlew


      # ============================================================
      # 16. CHECK XML BEFORE GRADLE
      # ============================================================

      - name: Validate Android XML
        shell: bash
        run: |

          set -e

          echo "Checking activity_main.xml..."

          sed -n '1,30p' \
            app/src/main/res/layout/activity_main.xml

          echo ""

          echo "Checking styles.xml..."

          sed -n '1,30p' \
            app/src/main/res/values/styles.xml

          echo ""

          echo "Checking AndroidManifest.xml..."

          sed -n '1,40p' \
            app/src/main/AndroidManifest.xml

          echo ""

          echo "XML files created successfully."


      # ============================================================
      # 17. BUILD APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |

          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            clean \
            assembleDebug


      # ============================================================
      # 18. CHECK APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |

          set -e

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then

              echo "ERROR: APK was not generated."

              exit 1
          fi


          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK_PATH"


      # ============================================================
      # 19. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ env.BUILD_ID }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
