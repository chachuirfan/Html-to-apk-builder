name: Direct HTML to APK Builder

on:
  push:
    branches:
      - "build/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Build Branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Required Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Read Builder Settings
        shell: bash
        run: |
          python3 <<'PY'
          import json, os, re

          path = "builder-settings.json"

          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  s = json.load(f)
          else:
              s = {}

          def first(*keys, default=""):
              for k in keys:
                  v = s.get(k)
                  if v is not None and str(v).strip():
                      return str(v).strip()
              return default

          app_name = first(
              "appName",
              "name",
              default="HTML APK App"
          )

          package = first(
              "packageName",
              "package",
              "applicationId",
              default="com.htmlapk.builder"
          ).lower()

          package = re.sub(
              r'[^a-z0-9._]',
              '',
              package
          )

          parts = [p for p in package.split(".") if p]
          if len(parts) < 2 or any(not re.match(r'^[a-z][a-z0-9_]*$', p) for p in parts):
              package = "com.htmlapk.builder"

          version_name = first(
              "versionName",
              "version",
              default="1.0"
          )

          try:
              version_code = int(
                  s.get("versionCode", 1)
              )
          except:
              version_code = 1

          try:
              min_sdk = int(
                  s.get("minSdk", 23)
              )
          except:
              min_sdk = 23

          if min_sdk < 23:
              min_sdk = 23

          if min_sdk > 35:
              min_sdk = 35

          orientation = first(
              "orientation",
              default="unspecified"
          ).lower()

          orientation_map = {
              "portrait": "portrait",
              "landscape": "landscape",
              "sensor": "sensor",
              "auto": "unspecified",
              "unspecified": "unspecified"
          }

          orientation = orientation_map.get(
              orientation,
              "unspecified"
          )

          splash_seconds = first(
              "splashDuration",
              "splashTime",
              default="2"
          )

          try:
              splash_ms = int(
                  float(splash_seconds) * 1000
              )
          except:
              splash_ms = 2000

          splash_ms = max(
              500,
              min(splash_ms, 5000)
          )

          env = os.environ["GITHUB_ENV"]

          with open(env, "a", encoding="utf-8") as f:
              f.write("APP_NAME=" + app_name.replace("\n"," ") + "\n")
              f.write("PACKAGE_NAME=" + package + "\n")
              f.write("VERSION_NAME=" + version_name + "\n")
              f.write("VERSION_CODE=" + str(version_code) + "\n")
              f.write("MIN_SDK=" + str(min_sdk) + "\n")
              f.write("ORIENTATION=" + orientation + "\n")
              f.write("SPLASH_MS=" + str(splash_ms) + "\n")

          print("App Name:", app_name)
          print("Package:", package)
          print("Version:", version_name)
          print("Version Code:", version_code)
          print("Min SDK:", min_sdk)
          print("Orientation:", orientation)
          print("Splash:", splash_ms, "ms")
          PY

      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/htmlapk/builder
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "IrfanAPKBuilder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.htmlapk.builder'
              compileSdk 35

              defaultConfig {
                  applicationId "${PACKAGE_NAME}"
                  minSdk ${MIN_SDK}
                  targetSdk 35
                  versionCode ${VERSION_CODE}
                  versionName "${VERSION_NAME}"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      - name: Prepare HTML Source
        shell: bash
        run: |
          set -e

          rm -rf app/src/main/assets/*
          mkdir -p app/src/main/assets

          if [ -f "uploads/source.zip" ]; then

            echo "ZIP source detected"

            rm -rf /tmp/apksource
            mkdir -p /tmp/apksource

            unzip -q "uploads/source.zip" -d /tmp/apksource

            if [ -f "/tmp/apksource/index.html" ]; then
              cp -R /tmp/apksource/. app/src/main/assets/
            else
              INDEX_FILE="$(find /tmp/apksource -type f -iname 'index.html' | head -n 1)"

              if [ -z "$INDEX_FILE" ]; then
                echo "ERROR: ZIP does not contain index.html"
                exit 1
              fi

              ROOT_DIR="$(dirname "$INDEX_FILE")"
              cp -R "$ROOT_DIR"/. app/src/main/assets/
            fi

          elif [ -f "index.html" ]; then

            echo "HTML source detected"
            cp index.html app/src/main/assets/index.html

          else

            echo "ERROR: No HTML/ZIP source found"
            exit 1
          fi

          cp builder-settings.json \
             app/src/main/assets/builder-settings.json || true

      - name: Prepare App Icon
        shell: bash
        run: |
          set -e

          if [ -f "uploads/app-icon.png" ]; then
            cp uploads/app-icon.png \
               app/src/main/res/drawable/app_icon.png
          else
            python3 - <<'PY'
          import base64
          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
          )
          open(
              "app/src/main/res/drawable/app_icon.png",
              "wb"
          ).write(png)
          PY
          fi

      - name: Prepare Splash Image
        shell: bash
        run: |
          set -e

          if [ -f "uploads/splash-logo.png" ]; then
            cp uploads/splash-logo.png \
               app/src/main/res/drawable/splash_logo.png
            echo "HAS_SPLASH=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SPLASH=false" >> "$GITHUB_ENV"
          fi

      - name: Create Android Resources
        shell: bash
        run: |
          python3 <<'PY'
          import os
          from xml.sax.saxutils import escape

          app_name = escape(
              os.environ.get(
                  "APP_NAME",
                  "HTML APK App"
              )
          )

          with open(
              "app/src/main/res/values/strings.xml",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  f'    <string name="app_name">{app_name}</string>\n'
                  '</resources>\n'
              )
          PY

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>

          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <FrameLayout
                  android:id="@+id/splash"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000">

                  <ImageView
                      android:id="@+id/splashLogo"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:scaleType="centerInside"
                      android:adjustViewBounds="true" />

              </FrameLayout>

          </FrameLayout>
          EOF

      - name: Create Android Manifest
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="${ORIENTATION}"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create Main Activity
        shell: bash
        run: |
          cat > app/src/main/java/com/htmlapk/builder/MainActivity.java <<EOF
          package com.htmlapk.builder;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.provider.Settings;
          import android.view.View;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ImageView;

          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private View splash;
              private ValueCallback<Uri[]> fileCallback;

              private static final int FILE_REQUEST = 9001;
              private static final int PERMISSION_REQUEST = 9002;

              private WebViewAssetLoader assetLoader;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  assetLoader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(this)
                          )
                          .build();

                  webView = findViewById(R.id.webview);
                  splash = findViewById(R.id.splash);
                  ImageView splashLogo = findViewById(R.id.splashLogo);

                  if ("${HAS_SPLASH}".equals("true")) {
                      splashLogo.setImageResource(R.drawable.splash_logo);
                      splash.setVisibility(View.VISIBLE);
                  } else {
                      splash.setVisibility(View.GONE);
                  }

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(true);

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Nullable
                          @Override
                          public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                          ) {
                              return assetLoader.shouldInterceptRequest(
                                  request.getUrl()
                              );
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {
                              Uri uri = request.getUrl();

                              if (
                                  "http".equals(uri.getScheme()) ||
                                  "https".equals(uri.getScheme())
                              ) {
                                  return false;
                              }

                              try {
                                  startActivity(
                                      new Intent(
                                          Intent.ACTION_VIEW,
                                          uri
                                      )
                                  );
                              } catch (Exception ignored) {}

                              return true;
                          }
                      }
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              PermissionRequest request
                          ) {
                              runOnUiThread(
                                  () -> request.grant(
                                      request.getResources()
                                  )
                              );
                          }

                          @Override
                          public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback
                          ) {
                              callback.invoke(
                                  origin,
                                  true,
                                  false
                              );
                          }

                          @Override
                          public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params
                          ) {
                              if (fileCallback != null) {
                                  fileCallback.onReceiveValue(null);
                              }

                              fileCallback = callback;

                              Intent intent =
                                  params.createIntent();

                              try {
                                  startActivityForResult(
                                      intent,
                                      FILE_REQUEST
                                  );
                                  return true;
                              } catch (Exception e) {
                                  fileCallback = null;
                                  return false;
                              }
                          }
                      }
                  );

                  requestNeededPermissions();

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );

                  if ("${HAS_SPLASH}".equals("true")) {
                      new Handler().postDelayed(
                          () -> {
                              splash.animate()
                                  .alpha(0f)
                                  .setDuration(300)
                                  .withEndAction(
                                      () -> splash.setVisibility(
                                          View.GONE
                                      )
                                  );
                          },
                          ${SPLASH_MS}
                      );
                  }
              }

              private void requestNeededPermissions() {

                  if (Build.VERSION.SDK_INT >= 23) {

                      String[] permissions = {
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO
                      };

                      boolean needed = false;

                      for (String permission : permissions) {
                          if (
                              ContextCompat.checkSelfPermission(
                                  this,
                                  permission
                              ) != PackageManager.PERMISSION_GRANTED
                          ) {
                              needed = true;
                              break;
                          }
                      }

                      if (needed) {
                          ActivityCompat.requestPermissions(
                              this,
                              permissions,
                              PERMISSION_REQUEST
                          );
                      }
                  }
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (
                      requestCode == FILE_REQUEST &&
                      fileCallback != null
                  ) {
                      Uri[] results = null;

                      if (
                          resultCode == Activity.RESULT_OK &&
                          data != null
                      ) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          }
                      }

                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Build APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --parallel \
            --build-cache \
            :app:assembleDebug

      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi



          echo "VERIFYING APK:"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | head -n 8
          fi
          cp "$APK" output/app-debug.apk

          echo "APK READY:"
          ls -lh output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: output/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
