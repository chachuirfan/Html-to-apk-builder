name: Direct HTML to APK Builder

on:
  push:
    branches:
      - "build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # BUILD ID
      # ============================================================

      - name: Get Build ID
        shell: bash
        run: |
          set -e

          BUILD_ID="${GITHUB_REF_NAME#build/}"

          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="manual-build"
          fi

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          echo "======================================"
          echo "BUILD ID: $BUILD_ID"
          echo "BRANCH: $GITHUB_REF_NAME"
          echo "======================================"


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK 35
      # ============================================================

      - name: Setup Android SDK 35
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Using Android SDK: $SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 ready."


      # ============================================================
      # CREATE ANDROID DIRECTORIES
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/htmlapk/builder
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets


      # ============================================================
      # SETTINGS.GRADLE
      # ============================================================

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HtmlToApkBuilder"

          include(":app")
          EOF


      # ============================================================
      # ROOT BUILD.GRADLE
      # ============================================================

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ============================================================
      # GRADLE PROPERTIES
      # ============================================================

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=true
          EOF


      # ============================================================
      # APP BUILD.GRADLE
      #
      # Kotlin dependencies are aligned here to prevent:
      # checkDebugDuplicateClasses
      # ============================================================

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.htmlapk.builder'
              compileSdk 35

              defaultConfig {
                  applicationId "com.htmlapk.builder"

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }


          configurations.configureEach {

              resolutionStrategy {

                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }


          dependencies {

              implementation('androidx.appcompat:appcompat:1.7.0') {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }

              implementation('androidx.webkit:webkit:1.12.1') {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }

              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          EOF


      # ============================================================
      # ANDROID MANIFEST
      # ============================================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission android:name="android.permission.CAMERA" />

              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:label="HTML APK"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # STYLE
      # ============================================================

      - name: Create styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#2196F3</item>

                  <item name="android:statusBarColor">#000000</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # WEBVIEW LAYOUT
      # ============================================================

      - name: Create activity_main.xml
        shell: bash
        run: |
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF


      # ============================================================
      # MAIN ACTIVITY
      # ============================================================

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/htmlapk/builder/MainActivity.java <<'EOF'
          package com.htmlapk.builder;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;

          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.webkit.WebViewAssetLoader;

          import java.util.ArrayList;
          import java.util.List;


          public class MainActivity extends AppCompatActivity {

              private static final int PERMISSION_REQUEST_CODE = 2001;

              private static final int FILE_CHOOSER_REQUEST_CODE = 3001;

              private WebView webView;

              private ValueCallback<Uri[]> filePathCallback;

              private WebViewAssetLoader assetLoader;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);


                  // =================================================
                  // HTTPS-LIKE LOCAL ASSET LOADER
                  // =================================================

                  assetLoader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(this)
                          )
                          .build();


                  // =================================================
                  // WEBVIEW SETTINGS
                  // =================================================

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  settings.setSupportMultipleWindows(false);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(true);

                  settings.setSupportZoom(false);


                  // =================================================
                  // COOKIES
                  // =================================================

                  CookieManager cookieManager =
                      CookieManager.getInstance();

                  cookieManager.setAcceptCookie(true);

                  if (android.os.Build.VERSION.SDK_INT >=
                      android.os.Build.VERSION_CODES.LOLLIPOP) {

                      cookieManager.setAcceptThirdPartyCookies(
                          webView,
                          true
                      );
                  }


                  // =================================================
                  // WEBVIEW CLIENT
                  // =================================================

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              WebResourceResponse response =
                                  assetLoader.shouldInterceptRequest(
                                      request.getUrl()
                                  );

                              if (response != null) {

                                  return response;
                              }

                              return super.shouldInterceptRequest(
                                  view,
                                  request
                              );
                          }


                          @Override
                          public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              String url
                          ) {

                              WebResourceResponse response =
                                  assetLoader.shouldInterceptRequest(
                                      Uri.parse(url)
                                  );

                              if (response != null) {

                                  return response;
                              }

                              return super.shouldInterceptRequest(
                                  view,
                                  url
                              );
                          }
                      }
                  );


                  // =================================================
                  // WEB CHROME CLIENT
                  // CAMERA / MICROPHONE / FILE CHOOSER
                  // =================================================

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(() -> {

                                  List<String> allowed =
                                      new ArrayList<>();


                                  for (
                                      String resource :
                                      request.getResources()
                                  ) {

                                      if (
                                          PermissionRequest
                                              .RESOURCE_AUDIO_CAPTURE
                                              .equals(resource)
                                      ) {

                                          if (
                                              ContextCompat
                                                  .checkSelfPermission(
                                                      MainActivity.this,
                                                      Manifest.permission.RECORD_AUDIO
                                                  )
                                              ==
                                              PackageManager.PERMISSION_GRANTED
                                          ) {

                                              allowed.add(
                                                  PermissionRequest
                                                      .RESOURCE_AUDIO_CAPTURE
                                              );
                                          }
                                      }


                                      if (
                                          PermissionRequest
                                              .RESOURCE_VIDEO_CAPTURE
                                              .equals(resource)
                                      ) {

                                          if (
                                              ContextCompat
                                                  .checkSelfPermission(
                                                      MainActivity.this,
                                                      Manifest.permission.CAMERA
                                                  )
                                              ==
                                              PackageManager.PERMISSION_GRANTED
                                          ) {

                                              allowed.add(
                                                  PermissionRequest
                                                      .RESOURCE_VIDEO_CAPTURE
                                              );
                                          }
                                      }
                                  }


                                  if (!allowed.isEmpty()) {

                                      request.grant(
                                          allowed.toArray(
                                              new String[0]
                                          )
                                      );

                                  } else {

                                      request.deny();
                                  }
                              });
                          }


                          @Override
                          public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params
                          ) {

                              if (filePathCallback != null) {

                                  filePathCallback
                                      .onReceiveValue(null);
                              }


                              filePathCallback = callback;


                              Intent intent;


                              try {

                                  intent =
                                      params.createIntent();

                              } catch (Exception e) {

                                  intent =
                                      new Intent(
                                          Intent.ACTION_GET_CONTENT
                                      );

                                  intent.setType("*/*");

                                  intent.addCategory(
                                      Intent.CATEGORY_OPENABLE
                                  );
                              }


                              try {

                                  startActivityForResult(
                                      intent,
                                      FILE_CHOOSER_REQUEST_CODE
                                  );

                              } catch (
                                  ActivityNotFoundException e
                              ) {

                                  filePathCallback = null;

                                  return false;
                              }


                              return true;
                          }
                      }
                  );


                  // =================================================
                  // DOWNLOAD SUPPORT
                  // =================================================

                  webView.setDownloadListener(
                      new DownloadListener() {

                          @Override
                          public void onDownloadStart(
                              String url,
                              String userAgent,
                              String contentDisposition,
                              String mimetype,
                              long contentLength
                          ) {

                              try {

                                  Intent intent =
                                      new Intent(
                                          Intent.ACTION_VIEW
                                      );

                                  intent.setData(
                                      Uri.parse(url)
                                  );

                                  startActivity(intent);

                              } catch (Exception ignored) {
                              }
                          }
                      }
                  );


                  // =================================================
                  // ANDROID PERMISSIONS
                  // =================================================

                  requestRequiredPermissions();


                  // =================================================
                  // LOAD LOCAL HTML THROUGH HTTPS ORIGIN
                  // =================================================

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );
              }


              // =====================================================
              // REQUEST CAMERA + MICROPHONE
              // =====================================================

              private void requestRequiredPermissions() {

                  ArrayList<String> permissions =
                      new ArrayList<>();


                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      )
                      !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      permissions.add(
                          Manifest.permission.CAMERA
                      );
                  }


                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      )
                      !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      permissions.add(
                          Manifest.permission.RECORD_AUDIO
                      );
                  }


                  if (!permissions.isEmpty()) {

                      ActivityCompat.requestPermissions(
                          this,
                          permissions.toArray(
                              new String[0]
                          ),
                          PERMISSION_REQUEST_CODE
                      );
                  }
              }


              // =====================================================
              // FILE CHOOSER RESULT
              // =====================================================

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  @Nullable Intent data
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );


                  if (
                      requestCode !=
                      FILE_CHOOSER_REQUEST_CODE
                  ) {

                      return;
                  }


                  Uri[] results = null;


                  if (
                      resultCode == Activity.RESULT_OK
                      &&
                      data != null
                  ) {

                      if (
                          data.getDataString() != null
                      ) {

                          results =
                              new Uri[] {
                                  Uri.parse(
                                      data.getDataString()
                                  )
                              };

                      } else if (
                          data.getClipData() != null
                      ) {

                          int count =
                              data.getClipData()
                                  .getItemCount();


                          results =
                              new Uri[count];


                          for (
                              int i = 0;
                              i < count;
                              i++
                          ) {

                              results[i] =
                                  data.getClipData()
                                      .getItemAt(i)
                                      .getUri();
                          }
                      }
                  }


                  if (filePathCallback != null) {

                      filePathCallback
                          .onReceiveValue(results);

                      filePathCallback = null;
                  }
              }


              // =====================================================
              // BACK BUTTON
              // =====================================================

              @Override
              public void onBackPressed() {

                  if (
                      webView != null
                      &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              // =====================================================
              // CLEANUP
              // =====================================================

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.setWebChromeClient(null);

                      webView.setWebViewClient(null);

                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF


      # ============================================================
      # PREPARE HTML / ZIP SOURCE
      # ============================================================

      - name: Prepare HTML source
        shell: bash
        run: |
          set -e

          rm -rf app/src/main/assets/*

          mkdir -p app/src/main/assets

          echo "======================================"
          echo "Preparing HTML application"
          echo "======================================"


          # ROOT index.html
          if [ -f "index.html" ]; then

              echo "Root index.html found."

              find . \
                -maxdepth 1 \
                -mindepth 1 \
                ! -name ".git" \
                ! -name ".github" \
                ! -name "app" \
                ! -name "gradle" \
                ! -name "build.gradle" \
                ! -name "settings.gradle" \
                ! -name "gradle.properties" \
                -exec cp -a {} app/src/main/assets/ \;

          else

              SOURCE_DIR=""

              for DIR in \
                  www \
                  web \
                  website \
                  public \
                  source \
                  src
              do

                  if [ -f "$DIR/index.html" ]; then

                      SOURCE_DIR="$DIR"

                      break
                  fi
              done


              if [ -n "$SOURCE_DIR" ]; then

                  echo "Web source found in:"
                  echo "$SOURCE_DIR"

                  cp -a \
                    "$SOURCE_DIR"/. \
                    app/src/main/assets/

              else

                  ZIP_FILE=""


                  for FILE in \
                      *.zip \
                      uploads/*.zip
                  do

                      if [ -f "$FILE" ]; then

                          ZIP_FILE="$FILE"

                          break
                      fi
                  done


                  if [ -n "$ZIP_FILE" ]; then

                      echo "ZIP found:"
                      echo "$ZIP_FILE"

                      rm -rf /tmp/html-source

                      mkdir -p /tmp/html-source

                      unzip -q \
                        "$ZIP_FILE" \
                        -d /tmp/html-source


                      INDEX_PATH="$(
                          find /tmp/html-source \
                              -type f \
                              -iname "index.html" \
                              | head -n 1
                      )"


                      if [ -z "$INDEX_PATH" ]; then

                          echo "ERROR:"
                          echo "ZIP does not contain index.html"

                          exit 1
                      fi


                      INDEX_DIR="$(
                          dirname "$INDEX_PATH"
                      )"


                      echo "Using HTML directory:"
                      echo "$INDEX_DIR"


                      cp -a \
                        "$INDEX_DIR"/. \
                        app/src/main/assets/

                  else

                      echo "ERROR:"
                      echo "No index.html or ZIP found."

                      echo ""
                      echo "Repository files:"

                      find . \
                        -maxdepth 3 \
                        -type f \
                        | sort \
                        | head -300

                      exit 1
                  fi
              fi
          fi


          # Remove repository/build files
          rm -rf app/src/main/assets/.git

          rm -rf app/src/main/assets/.github

          rm -f app/src/main/assets/build.gradle

          rm -f app/src/main/assets/settings.gradle

          rm -f app/src/main/assets/gradle.properties


          # Verify index
          if [
              ! -f "app/src/main/assets/index.html"
          ]; then

              echo "ERROR:"
              echo "Final assets/index.html does not exist."

              exit 1
          fi


          echo ""
          echo "======================================"
          echo "FILES INCLUDED IN APK"
          echo "======================================"


          find app/src/main/assets \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -300


      # ============================================================
      # GRADLE 8.9
      # ============================================================

      - name: Setup Gradle 8.9
        shell: bash
        run: |
          set -e

          echo "Downloading Gradle 8.9..."

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          rm -rf /tmp/gradle-8.9

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp

          test -x \
            /tmp/gradle-8.9/bin/gradle

          /tmp/gradle-8.9/bin/gradle \
            --version


      # ============================================================
      # CHECK DEPENDENCIES
      # ============================================================

      - name: Check Android dependencies
        shell: bash
        run: |
          set -e

          echo "Checking dependency tree..."

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            app:dependencies \
            --configuration debugRuntimeClasspath \
            > /tmp/dependencies.txt

          echo "Kotlin dependencies:"

          grep \
            "org.jetbrains.kotlin" \
            /tmp/dependencies.txt \
            || true


      # ============================================================
      # VALIDATE GENERATED FILES
      # ============================================================

      - name: Validate generated files
        shell: bash
        run: |
          set -e

          test -f \
            app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/res/layout/activity_main.xml

          test -f \
            app/src/main/res/values/styles.xml

          test -f \
            app/src/main/java/com/htmlapk/builder/MainActivity.java

          test -f \
            app/src/main/assets/index.html

          echo "Generated Android files OK."


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            clean \
            assembleDebug


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

              echo "ERROR:"
              echo "APK was not generated."

              exit 1
          fi


          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ env.BUILD_ID }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
