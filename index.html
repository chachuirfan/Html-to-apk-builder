<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Calculator</title>
<style>
:root{--bg:#06101d;--card:#0d1c2f;--card2:#12253d;--line:#253c59;--text:#f5f8ff;--muted:#93a8c2;--cyan:#38d9ff;--blue:#3878ff;--green:#28d17c;--red:#ff5d68;--gold:#ffbd45;--shadow:0 18px 50px #0008}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#163453 0,#071423 42%,#030911 100%);color:var(--text);font:500 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}.hidden{display:none!important}button,input,textarea{font:inherit}.app{min-height:100vh}.calc-wrap{width:min(100%,430px);min-height:100vh;margin:auto;padding:22px 18px 26px;display:flex;flex-direction:column;justify-content:center}.brand{display:flex;justify-content:space-between;color:var(--muted);padding:0 7px 16px;font-size:13px}.brand b{color:var(--cyan);letter-spacing:1.4px}.display{background:linear-gradient(145deg,#0d1b2c,#091522);border:1px solid #233b56;border-radius:25px;min-height:150px;padding:22px 19px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-end;text-align:right;overflow:hidden}.history{height:27px;color:var(--muted);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.screen{font-size:42px;font-weight:700;min-height:55px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:19px}.key{border:0;border-radius:20px;min-height:67px;color:var(--text);background:linear-gradient(145deg,#162a43,#0f1f33);box-shadow:5px 6px 13px #0007,-2px -2px 6px #29415d66;font-size:23px;font-weight:700}.key:active{transform:scale(.95);filter:brightness(1.25)}.key.op{color:var(--cyan);background:#102a3d}.key.utility{color:var(--gold)}.key.danger{color:#ff7180}.key.equal{background:linear-gradient(145deg,#31c8f5,#286cff);color:white;box-shadow:0 9px 25px #2178ff66}.vault{min-height:100vh;background:linear-gradient(160deg,#05101d,#091829 55%,#06111e)}.vault-head{position:sticky;top:0;z-index:5;background:#071423ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:15px max(15px,calc((100% - 950px)/2));display:flex;align-items:center;gap:12px}.vault-logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#27d29a,#1680ef);font-size:22px}.vault-title{flex:1}.vault-title b{display:block;font-size:18px}.vault-title small{color:var(--muted)}.icon-btn,.primary,.secondary,.danger-btn{border:0;color:white;border-radius:13px;padding:11px 14px;font-weight:700}.icon-btn{background:var(--card2);font-size:18px}.primary{background:linear-gradient(135deg,#1595ee,#2bd19b)}.secondary{background:#172c45;border:1px solid #2a4768}.danger-btn{background:#5d2028;color:#ffb6bd}.vault-main{max-width:950px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:linear-gradient(145deg,#10233a,#0b192a);border:1px solid var(--line);border-radius:17px;padding:14px}.stat b{display:block;font-size:19px;color:var(--cyan)}.stat span{font-size:12px;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.action{border:1px solid var(--line);background:#10223a;color:white;border-radius:17px;padding:15px 7px;font-weight:700}.action i{display:block;font-style:normal;font-size:24px;margin-bottom:6px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:9px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0d1d30;color:var(--muted);padding:9px 15px;border-radius:999px}.tab.active{background:#2179da;color:white;border-color:#318cf1}.toolbar{display:flex;gap:9px;margin:8px 0 14px}.search{flex:1;background:#0b1b2e;border:1px solid var(--line);border-radius:13px;color:white;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);border:1px dashed #304964;border-radius:20px;padding:48px 18px}.item{position:relative;background:#0d1d30;border:1px solid var(--line);border-radius:18px;overflow:hidden}.thumb{height:112px;background:linear-gradient(145deg,#17304d,#0a1828);display:grid;place-items:center;font-size:42px}.item-info{padding:11px}.item-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}.item-menu{position:absolute;right:7px;top:7px;border:0;border-radius:10px;background:#06101dcc;color:white;padding:7px 10px}.note-card{grid-column:span 2}.note-card .thumb{height:auto;min-height:112px;display:block;padding:15px;font-size:14px;white-space:pre-wrap;overflow:hidden}.modal-bg{position:fixed;inset:0;z-index:20;background:#000b;display:grid;place-items:center;padding:18px}.modal{width:min(100%,460px);max-height:92vh;overflow:auto;background:#0c1c2f;border:1px solid #2b4768;border-radius:23px;padding:20px;box-shadow:var(--shadow)}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.5}.field{width:100%;background:#071423;border:1px solid #2a4665;color:white;padding:13px;border-radius:12px;margin:6px 0 11px}.modal-row{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}.viewer{width:min(100%,900px)}.viewer-media{width:100%;max-height:70vh;object-fit:contain;background:#000;border-radius:14px}.viewer audio{width:100%}.viewer pre{white-space:pre-wrap;color:white}.toast{position:fixed;z-index:50;left:50%;bottom:25px;transform:translateX(-50%);background:#172a41;color:white;border:1px solid #365674;border-radius:13px;padding:11px 17px;box-shadow:var(--shadow);max-width:90%;text-align:center}.progress{height:6px;background:#102238;border-radius:10px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;width:35%;background:var(--cyan);animation:load 1s infinite alternate}@keyframes load{to{transform:translateX(190%)}}@media(max-width:520px){.actions{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.note-card{grid-column:span 2}.vault-head{padding:12px}.vault-main{padding:13px}.key{min-height:64px}.stats{gap:7px}.stat{padding:11px 9px}}
</style>
</head>
<body>
<div class="app" id="calculatorPage">
  <main class="calc-wrap">
    <div class="brand"><b>SMART CALCULATOR</b><span>Offline</span></div>
    <section class="display"><div class="history" id="history"></div><div class="screen" id="screen">0</div></section>
    <section class="keys" id="keys">
      <button class="key danger" data-a="clear">AC</button><button class="key utility" data-a="back">⌫</button><button class="key op" data-v="%">%</button><button class="key op" data-v="÷">÷</button>
      <button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key op" data-v="×">×</button>
      <button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key op" data-v="-">−</button>
      <button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key op" data-v="+">+</button>
      <button class="key utility" data-a="sign">±</button><button class="key" data-v="0">0</button><button class="key" data-v=".">.</button><button class="key equal" data-a="equals">=</button>
    </section>
  </main>
</div>

<div class="vault hidden" id="vaultPage">
  <header class="vault-head"><div class="vault-logo">🔐</div><div class="vault-title"><b>Private Vault</b><small>Encrypted • Offline</small></div><button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button><button class="icon-btn" id="lockBtn" title="Lock">🔒</button></header>
  <main class="vault-main">
    <section class="stats"><div class="stat"><b id="fileCount">0</b><span>Files</span></div><div class="stat"><b id="noteCount">0</b><span>Notes</span></div><div class="stat"><b id="totalSize">0 B</b><span>Storage</span></div></section>
    <section class="actions"><button class="action" id="addFile"><i>➕</i>Add Files</button><button class="action" id="addNote"><i>📝</i>New Note</button><button class="action" id="backupBtn"><i>📦</i>Backup</button><button class="action" id="restoreBtn"><i>♻️</i>Restore</button></section>
    <input class="hidden" id="fileInput" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip">
    <input class="hidden" id="restoreInput" type="file" accept="application/json,.cvault">
    <div class="tabs" id="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="image">Photos</button><button class="tab" data-filter="video">Videos</button><button class="tab" data-filter="audio">Audio</button><button class="tab" data-filter="note">Notes</button><button class="tab" data-filter="other">Documents</button></div>
    <div class="toolbar"><input class="search" id="search" placeholder="Search private items…"><button class="secondary" id="refreshBtn">↻</button></div>
    <section class="grid" id="itemsGrid"></section>
  </main>
</div>

<div class="modal-bg hidden" id="modalBg"><section class="modal" id="modal"></section></div>
<div class="toast hidden" id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const calcPage=$('#calculatorPage'),vaultPage=$('#vaultPage'),screen=$('#screen'),historyEl=$('#history');
const modalBg=$('#modalBg'),modal=$('#modal'),grid=$('#itemsGrid');
let expression='',vaultKey=null,currentFilter='all',idleTimer=null,objectUrls=[],pickerActive=false;
const DB_NAME='CalculatorPrivateVault',STORE='items',META='meta',DB_VERSION=1,MAX_FILE=250*1024*1024;

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.add('hidden'),2600)}
function showModal(html){modal.innerHTML=html;modalBg.classList.remove('hidden')}
function closeModal(){modalBg.classList.add('hidden');modal.innerHTML=''}
modalBg.addEventListener('click',e=>{if(e.target===modalBg)closeModal()});

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id'});s.createIndex('kind','kind');s.createIndex('created','created')}if(!d.objectStoreNames.contains(META))d.createObjectStore(META,{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbPut(store,value){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).put(value);t.oncomplete=()=>{d.close();res()};t.onerror=()=>rej(t.error)})}
async function dbGet(store,key){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>{d.close();res(r.result)};r.onerror=()=>rej(r.error)})}
async function dbAll(store){const d=await openDB();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).getAll();r.onsuccess=()=>{d.close();res(r.result)};r.onerror=()=>rej(r.error)})}
async function dbDelete(store,key){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=()=>{d.close();res()};t.onerror=()=>rej(t.error)})}
async function dbClear(store){const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).clear();t.oncomplete=()=>{d.close();res()};t.onerror=()=>rej(t.error)})}
const bytesToB64=b=>{let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)};
const b64ToBytes=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function pinKey(pin,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function initVault(){let m=await dbGet(META,'security');if(m)return m;const salt=crypto.getRandomValues(new Uint8Array(16)),wrapIv=crypto.getRandomValues(new Uint8Array(12)),raw=crypto.getRandomValues(new Uint8Array(32)),pk=await pinKey('3443',salt),wrapped=await crypto.subtle.encrypt({name:'AES-GCM',iv:wrapIv},pk,raw);m={key:'security',salt:bytesToB64(salt),wrapIv:bytesToB64(wrapIv),wrapped:bytesToB64(wrapped),created:Date.now()};await dbPut(META,m);return m}
async function unlock(pin){try{const m=await initVault(),pk=await pinKey(pin,b64ToBytes(m.salt)),raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(m.wrapIv)},pk,b64ToBytes(m.wrapped));vaultKey=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt']);return true}catch{return false}}
async function encryptData(buffer){const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},vaultKey,buffer);return{iv:bytesToB64(iv),data:new Blob([data])}}
async function decryptData(item){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(item.iv)},vaultKey,await item.data.arrayBuffer())}
function resetIdle(){if(!vaultKey)return;clearTimeout(idleTimer);idleTimer=setTimeout(()=>lockVault(true),3*60*1000)}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
window.addEventListener('focus',()=>{if(pickerActive)setTimeout(()=>{pickerActive=false;resetIdle()},1200)});

$('#keys').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v,a=b.dataset.a;if(v){if(expression==='0')expression='';expression+=v;screen.textContent=expression;screen.scrollLeft=screen.scrollWidth;return}if(a==='clear'){expression='';screen.textContent='0';historyEl.textContent=''}if(a==='back'){expression=expression.slice(0,-1);screen.textContent=expression||'0'}if(a==='sign'){if(expression&&!/[+\-×÷]$/.test(expression)){const m=expression.match(/(.*?)(-?\d*\.?\d+)$/);if(m)expression=m[1]+String(-Number(m[2]));screen.textContent=expression||'0'}}if(a==='equals')await calculate()});
async function calculate(){if(/^\d{4,12}$/.test(expression)){screen.textContent='Calculating…';if(await unlock(expression)){expression='';openVault();return}screen.textContent=expression}if(!expression)return;try{let clean=expression.replace(/×/g,'*').replace(/÷/g,'/').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[\d+\-*/().\s]+$/.test(clean))throw 0;const result=Function('"use strict";return ('+clean+')')();if(!Number.isFinite(result))throw 0;historyEl.textContent=expression+' =';expression=String(Math.round((result+Number.EPSILON)*1e10)/1e10);screen.textContent=expression}catch{screen.textContent='Error';expression='';setTimeout(()=>screen.textContent='0',1000)}}

async function openVault(){calcPage.classList.add('hidden');vaultPage.classList.remove('hidden');history.pushState({vault:true},'','#vault');await renderItems();resetIdle()}
function lockVault(auto=false){vaultKey=null;objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];closeModal();vaultPage.classList.add('hidden');calcPage.classList.remove('hidden');expression='';screen.textContent='0';historyEl.textContent='';clearTimeout(idleTimer);if(location.hash)history.replaceState({},'',location.pathname+location.search);if(auto)toast('Vault auto-locked')}
$('#lockBtn').onclick=()=>lockVault();window.addEventListener('popstate',()=>{if(!vaultPage.classList.contains('hidden'))lockVault()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&vaultKey&&!pickerActive)lockVault()});

$('#addFile').onclick=()=>{pickerActive=true;$('#fileInput').click()};
$('#fileInput').onchange=async e=>{pickerActive=false;const files=[...e.target.files];e.target.value='';if(!files.length)return;if(!vaultKey){toast('Vault was locked — unlock and try again');return}showModal('<h2>Encrypting files</h2><p>Please keep this page open.</p><div class="progress"><span></span></div>');let ok=0,lastError='';for(const f of files){try{if(f.size>MAX_FILE){lastError=f.name+' is larger than 250 MB';continue}const enc=await encryptData(await f.arrayBuffer()),kind=f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':f.type.startsWith('audio/')?'audio':'other',id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);await dbPut(STORE,{id,name:f.name,type:f.type||'application/octet-stream',kind,size:f.size,created:Date.now(),iv:enc.iv,data:enc.data});ok++}catch(err){lastError=err?.message||'Unknown storage error';console.error(err)}}closeModal();if(ok)toast(ok+' file(s) encrypted successfully');else toast('Could not save files: '+lastError);await renderItems()};

$('#addNote').onclick=()=>showNoteEditor();
function showNoteEditor(item){showModal(`<h2>${item?'Edit':'New'} Private Note</h2><input class="field" id="noteTitle" maxlength="80" placeholder="Note title" value="${esc(item?.name||'')}"><textarea class="field" id="noteText" rows="9" placeholder="Write your private note…">${esc(item?.plain||'')}</textarea><div class="modal-row"><button class="secondary" id="cancelNote">Cancel</button><button class="primary" id="saveNote">Save Encrypted</button></div>`);$('#cancelNote').onclick=closeModal;$('#saveNote').onclick=async()=>{const title=$('#noteTitle').value.trim()||'Private Note',text=$('#noteText').value;if(!text.trim())return toast('Write something first');const raw=new TextEncoder().encode(text),enc=await encryptData(raw);await dbPut(STORE,{id:item?.id||crypto.randomUUID(),name:title,type:'text/plain',kind:'note',size:raw.byteLength,created:item?.created||Date.now(),updated:Date.now(),iv:enc.iv,data:enc.data});closeModal();toast('Note encrypted and saved');renderItems()}}

function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtSize(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
function icon(kind){return{image:'🖼️',video:'🎬',audio:'🎵',note:'📝',other:'📄'}[kind]||'📁'}
async function renderItems(){if(!vaultKey)return;objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];const all=(await dbAll(STORE)).sort((a,b)=>(b.updated||b.created)-(a.updated||a.created));$('#fileCount').textContent=all.filter(x=>x.kind!=='note').length;$('#noteCount').textContent=all.filter(x=>x.kind==='note').length;$('#totalSize').textContent=fmtSize(all.reduce((s,x)=>s+(x.size||0),0));const q=$('#search').value.trim().toLowerCase(),items=all.filter(x=>(currentFilter==='all'||x.kind===currentFilter)&&(x.name||'').toLowerCase().includes(q));grid.innerHTML=items.length?'':'<div class="empty"><div style="font-size:48px">🔐</div><h3>Your vault is empty</h3><p>Add files or create a private note.<br>Everything stays encrypted on this device.</p></div>';for(const x of items){let preview=icon(x.kind),plain='';if(x.kind==='note'){try{plain=new TextDecoder().decode(await decryptData(x));preview=esc(plain.slice(0,220))}catch{preview='Unable to decrypt note'}}else if(x.kind==='image'&&x.size<12*1024*1024){try{const url=URL.createObjectURL(new Blob([await decryptData(x)],{type:x.type}));objectUrls.push(url);preview=`<img src="${url}" style="width:100%;height:100%;object-fit:cover" alt="">`}catch{}}const el=document.createElement('article');el.className='item '+(x.kind==='note'?'note-card':'');el.innerHTML=`<button class="item-menu" data-menu="${x.id}">⋮</button><div class="thumb" data-open="${x.id}">${preview}</div><div class="item-info"><div class="item-name">${esc(x.name)}</div><div class="item-meta">${x.kind==='note'?'Encrypted note':fmtSize(x.size)} • ${new Date(x.created).toLocaleDateString()}</div></div>`;grid.appendChild(el)}}
$('#search').oninput=renderItems;$('#refreshBtn').onclick=renderItems;$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;renderItems()};
grid.onclick=async e=>{const id=e.target.closest('[data-open]')?.dataset.open||e.target.closest('[data-menu]')?.dataset.menu;if(!id)return;const item=await dbGet(STORE,id);if(e.target.closest('[data-menu]'))return itemMenu(item);viewItem(item)};
async function viewItem(item){showModal('<h2>Decrypting…</h2><div class="progress"><span></span></div>');try{const buf=await decryptData(item);if(item.kind==='note'){const plain=new TextDecoder().decode(buf);showModal(`<h2>${esc(item.name)}</h2><pre>${esc(plain)}</pre><div class="modal-row"><button class="secondary" id="closeView">Close</button><button class="primary" id="editView">Edit</button></div>`);$('#editView').onclick=()=>showNoteEditor({...item,plain});$('#closeView').onclick=closeModal;return}const url=URL.createObjectURL(new Blob([buf],{type:item.type}));objectUrls.push(url);let media=item.kind==='image'?`<img class="viewer-media" src="${url}">`:item.kind==='video'?`<video class="viewer-media" src="${url}" controls playsinline></video>`:item.kind==='audio'?`<audio src="${url}" controls></audio>`:`<p>This document can be opened after downloading it.</p>`;showModal(`<div class="viewer"><h2>${esc(item.name)}</h2>${media}<div class="modal-row"><button class="secondary" id="closeView">Close</button><button class="primary" id="downloadView">Download</button></div></div>`);$('#closeView').onclick=closeModal;$('#downloadView').onclick=()=>downloadBlob(new Blob([buf],{type:item.type}),item.name)}catch{closeModal();toast('Unable to decrypt this item')}}
function itemMenu(item){showModal(`<h2>${esc(item.name)}</h2><p>${item.kind==='note'?'Encrypted note':fmtSize(item.size)}<br>${new Date(item.created).toLocaleString()}</p><div class="modal-row"><button class="secondary" id="menuCancel">Cancel</button><button class="primary" id="menuOpen">Open</button><button class="danger-btn" id="menuDelete">Delete</button></div>`);$('#menuCancel').onclick=closeModal;$('#menuOpen').onclick=()=>viewItem(item);$('#menuDelete').onclick=()=>confirmDelete(item)}
function confirmDelete(item){showModal(`<h2>Delete permanently?</h2><p><b>${esc(item.name)}</b> will be removed from this device. This cannot be undone unless it exists in a backup.</p><div class="modal-row"><button class="secondary" id="noDelete">Cancel</button><button class="danger-btn" id="yesDelete">Delete</button></div>`);$('#noDelete').onclick=closeModal;$('#yesDelete').onclick=async()=>{await dbDelete(STORE,item.id);closeModal();toast('Item deleted');renderItems()}}
function downloadBlob(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}

$('#settingsBtn').onclick=()=>showModal(`<h2>Vault Settings</h2><p>Auto-lock: 3 minutes or whenever the app goes to background.</p><button class="field secondary" id="changePin">🔑 Change Secret PIN</button><button class="field secondary" id="aboutVault">🛡️ Security Information</button><div class="modal-row"><button class="secondary" id="settingsClose">Close</button></div>`);modal.addEventListener('click',e=>{if(e.target.id==='settingsClose')closeModal();if(e.target.id==='changePin')changePinDialog();if(e.target.id==='aboutVault')showModal('<h2>Security Information</h2><p>Your files are encrypted with AES‑256‑GCM. The PIN is processed locally and is never uploaded. Browser/App data must not be cleared unless you have exported a backup. Forgotten PINs cannot be recovered.</p><div class="modal-row"><button class="primary" id="settingsClose">OK</button></div>')});
function changePinDialog(){showModal(`<h2>Change Secret PIN</h2><input class="field" id="oldPin" type="password" inputmode="numeric" placeholder="Current PIN"><input class="field" id="newPin" type="password" inputmode="numeric" placeholder="New PIN (4–12 digits)"><input class="field" id="newPin2" type="password" inputmode="numeric" placeholder="Repeat new PIN"><div class="modal-row"><button class="secondary" id="cancelPin">Cancel</button><button class="primary" id="savePin">Change PIN</button></div>`);$('#cancelPin').onclick=closeModal;$('#savePin').onclick=async()=>{const old=$('#oldPin').value,n=$('#newPin').value,n2=$('#newPin2').value;if(!/^\d{4,12}$/.test(n))return toast('Use 4 to 12 digits');if(n!==n2)return toast('New PINs do not match');if(!await unlock(old))return toast('Current PIN is wrong');const raw=await crypto.subtle.exportKey('raw',vaultKey),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),pk=await pinKey(n,salt),wrapped=await crypto.subtle.encrypt({name:'AES-GCM',iv},pk,raw);await dbPut(META,{key:'security',salt:bytesToB64(salt),wrapIv:bytesToB64(iv),wrapped:bytesToB64(wrapped),created:Date.now()});closeModal();toast('PIN changed successfully')}}

$('#backupBtn').onclick=async()=>{showModal('<h2>Creating encrypted backup</h2><p>This can take time for large videos.</p><div class="progress"><span></span></div>');try{const security=await dbGet(META,'security'),items=await dbAll(STORE),packed=[];for(const x of items)packed.push({...x,data:bytesToB64(await x.data.arrayBuffer())});const payload={format:'calculator-vault',version:1,exported:new Date().toISOString(),security,items:packed};downloadBlob(new Blob([JSON.stringify(payload)],{type:'application/json'}),'Calculator_Vault_Backup_'+new Date().toISOString().slice(0,10)+'.cvault');closeModal();toast('Encrypted backup created')}catch(err){console.error(err);closeModal();toast('Backup failed — try fewer large files')}};
$('#restoreBtn').onclick=()=>{pickerActive=true;$('#restoreInput').click()};$('#restoreInput').onchange=async e=>{pickerActive=false;const f=e.target.files[0];e.target.value='';if(!f)return;try{const p=JSON.parse(await f.text());if(p.format!=='calculator-vault'||!Array.isArray(p.items)||!p.security)throw 0;showModal(`<h2>Restore backup?</h2><p>This will replace everything currently in this vault. You must unlock it afterward using the PIN that belonged to the backup.</p><div class="modal-row"><button class="secondary" id="cancelRestore">Cancel</button><button class="danger-btn" id="doRestore">Replace & Restore</button></div>`);$('#cancelRestore').onclick=closeModal;$('#doRestore').onclick=async()=>{showModal('<h2>Restoring…</h2><div class="progress"><span></span></div>');await dbClear(STORE);for(const x of p.items){x.data=new Blob([b64ToBytes(x.data)]);await dbPut(STORE,x)}await dbPut(META,p.security);closeModal();toast('Backup restored — unlock with its PIN');lockVault()}}catch{toast('Invalid or damaged backup file')}};

if(!window.crypto?.subtle||!window.indexedDB){alert('This browser does not support secure offline storage. Please use current Google Chrome.')}else initVault().catch(()=>toast('Storage initialization failed'));
</script>
</body>
